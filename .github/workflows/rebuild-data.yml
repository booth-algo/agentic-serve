name: Rebuild Dashboard Data

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Also deploy dashboard after rebuild'
        type: boolean
        default: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      R2_ENDPOINT: https://b33fe7347f25479b27ec9680eff19b78.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dashboard dependencies
        working-directory: inference-benchmark/dashboard
        run: npm ci

      - name: Install predictor dependencies
        run: python3 -m pip install -q numpy xgboost pyyaml

      - name: Download results from R2
        working-directory: inference-benchmark
        run: |
          pip install -q awscli
          mkdir -p results
          aws s3 sync s3://agent-bench/results/ results/ \
            --endpoint-url $R2_ENDPOINT
          echo "Downloaded $(find results -name '*.json' | wc -l) result files"

      - name: Build data.json
        working-directory: inference-benchmark/dashboard
        run: npm run build:data

      - name: Build sweep state
        working-directory: inference-benchmark
        run: python3 scripts/publish_sweep_state.py --no-upload

      - name: Build serving predictions
        run: python3 -m llm_predict.export_serving_predictions

      - name: Validate data.json
        working-directory: inference-benchmark/dashboard
        run: npm run validate:data

      - name: Upload data.json to R2
        working-directory: inference-benchmark
        run: |
          aws s3 cp dashboard/public/data.json s3://agent-bench/json/current/data.json \
            --endpoint-url $R2_ENDPOINT
          echo "Uploaded data.json ($(du -h dashboard/public/data.json | cut -f1))"

      - name: Upload sweep-state.json to R2
        working-directory: inference-benchmark
        run: |
          aws s3 cp dashboard/public/sweep-state.json s3://agent-bench/json/current/sweep-state.json \
            --endpoint-url $R2_ENDPOINT
          echo "Uploaded sweep-state.json ($(du -h dashboard/public/sweep-state.json | cut -f1))"

      - name: Upload serving predictions to R2
        working-directory: inference-benchmark
        run: |
          aws s3 cp dashboard/public/serving-predictions.json s3://agent-bench/json/current/serving-predictions.json \
            --endpoint-url $R2_ENDPOINT
          echo "Uploaded serving-predictions.json ($(du -h dashboard/public/serving-predictions.json | cut -f1))"

      - name: Verify R2 data.json
        working-directory: inference-benchmark/dashboard
        run: |
          aws s3 cp s3://agent-bench/json/current/data.json /tmp/dashboard-r2-data.json \
            --endpoint-url $R2_ENDPOINT
          npm run validate:data -- /tmp/dashboard-r2-data.json

      - name: Verify R2 sweep-state.json
        working-directory: inference-benchmark
        run: |
          aws s3 cp s3://agent-bench/json/current/sweep-state.json /tmp/dashboard-r2-sweep-state.json \
            --endpoint-url $R2_ENDPOINT
          python3 - <<'PY'
          import json
          state = json.load(open('/tmp/dashboard-r2-sweep-state.json'))
          cells = state.get('cells', [])
          synthetic_cells = [c for c in cells if c.get('data_scope') == 'synthetic_distributional']
          if not synthetic_cells:
              raise SystemExit('expected synthetic cells in sweep-state.json')
          synthetic_profiles = {
              profile
              for cell in synthetic_cells
              for profile in cell.get('profiles', [])
              if str(profile).endswith('-synth')
          }
          expected_profiles = {
              'chat-singleturn-synth',
              'chat-multiturn-synth',
              'swebench-multiturn-synth',
              'terminalbench-multiturn-synth',
              'osworld-multiturn-synth',
          }
          missing = sorted(expected_profiles - synthetic_profiles)
          if missing:
              raise SystemExit(f'missing synthetic profiles in sweep-state.json: {missing}')
          print(f'synthetic sweep-state cells: {len(synthetic_cells)}')
          print(f'synthetic profiles: {sorted(synthetic_profiles)}')
          PY

      - name: Verify R2 serving predictions
        working-directory: inference-benchmark
        run: |
          aws s3 cp s3://agent-bench/json/current/serving-predictions.json /tmp/dashboard-r2-serving-predictions.json \
            --endpoint-url $R2_ENDPOINT
          python3 - <<'PY'
          import json
          payload = json.load(open('/tmp/dashboard-r2-serving-predictions.json'))
          rows = payload.values()
          archived = sum(1 for group in rows for row in group if row.get('data_scope') == 'archived')
          if archived <= 0:
              raise SystemExit('expected archived serving prediction rows')
          h100x4_archived = sum(1 for row in payload.get('H100x4', []) if row.get('data_scope') == 'archived')
          if h100x4_archived <= 0:
              raise SystemExit('expected archived H100x4 serving prediction rows')
          print(f'archived serving prediction rows: {archived}')
          print(f'archived H100x4 serving prediction rows: {h100x4_archived}')
          PY

      - name: Upload roofline-quadrant.json to R2
        working-directory: inference-benchmark
        run: |
          if [ -f dashboard/public/roofline-quadrant.json ]; then
            aws s3 cp dashboard/public/roofline-quadrant.json s3://agent-bench/json/current/roofline-quadrant.json \
              --endpoint-url $R2_ENDPOINT
            echo "Uploaded roofline-quadrant.json"
          fi

  deploy:
    needs: rebuild
    if: ${{ inputs.deploy }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: inference-benchmark/dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: inference-benchmark/dashboard
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: inference-benchmark/dashboard/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Prediction pipeline — how the dashboard's per-turn TTFT / TPOT / E2EL predictions are produced.
#
# ONE config-driven generator (build_simulator_rows.py) writes
# inference-benchmark/dashboard/public/simulator-predictions.json for every (GPU, model, TP) config.
# The low-level kernel composition (full/cached prefill + decode grids -> per-step cost) lives in
# kernel_composition_method.yaml. The retired pre-2026-06 split pipeline (engine-step base producer +
# kernel/ttft augmenters + the bespoke tp2 file) is quarantined under profiling/process/_legacy/.

output:
  dashboard_json: inference-benchmark/dashboard/public/simulator-predictions.json   # gitignored, served by the dashboard from /
  consumed_by: "dashboard simulator page (ServingPredictionsPage, pageKind=simulator) — model + GPU dropdowns + TTFT/TPOT/E2EL MAPE badges"
  shape: >
    { <GPU_KEY>: [ row, ... ] }.  Each row = one (model, profile, concurrency) cell with
    multiturn_turn_predictions[]; each turn carries {ttft,tpot,e2el}_meas (ground truth),
    {ttft,tpot,e2el}_pred (the single headline), and {ttft,tpot,e2el}_{err,signed_err_ms,abs_err_ms}.
    Cell-level {ttft,tpot,e2el}_err (mean APE) drive the dashboard MAPE badges. Identical fields
    across all GPU keys (no per-config comparison lines).
  gpu_keys:
    H100:   "tp1 Llama-3.1-8B — the primary, fully-calibrated config"
    H100x2: "tp2 (2xH100) — measured decode grid + KV pool; serving prefill law still tp1 (first cut)"

pipeline:   # the whole JSON is produced by ONE script
  generator:
    script: profiling/process/build_simulator_rows.py   # run: python3 -m profiling.process.build_simulator_rows
    how: >
      A CONFIGS table (gpu_key, tp, bench_dir, available_kv_blocks, decode_grid) drives it. Per config x
      (profile, concurrency): build_turns() takes per-turn medians from the benchmark per_request, then
      predict_cell_tpot (headline tpot_pred) + predict_cell_ttft_qsim (ttft_pred) + e2el = ttft + out*tpot,
      with errors. Per config the decode grid is swapped via kernel_step_cost._default_grid and
      RooflineParams gets the config available_kv_blocks. Add a GPU/TP config = add a CONFIGS row.

predict:

  tpot:
    description: "Per-turn inter-token latency (ITL). Kernel-composed cost mapped to TPOT, regime-aware."
    status: validated
    headline_field: tpot_pred
    gate: "overall 15.91% MAPE; swebench-plateau 8.83% (validate_tpot.py)"
    predictor:
      module: simulator/kernel_tpot.py  (predict_cell_tpot)
      step_cost: "simulator/kernel_step_cost.py — measured decode grid, bilinear-interp in log space + roofline beyond the grid"
      formula: "kernel_step = decode_step_ms(B_eff, ctx); B_eff capped by KV pool; pressure-aware amplifier toward a saturated ITL ceiling"
    data:
      decode_grid: profile_data/results/decode_kernel_trace_H100_large_2026-05-17_wide_summary.csv  (kernel_step_cost DEFAULT_CSV; tp2 swaps in decode_profile_H100x2_*.csv)
      roofline_params: profile_data/kernels/roofline_params_H100_llama31_8b.json  (kv_bytes/token, bandwidth; available_kv_blocks per config: 27250 tp1 / 62416 tp2)

  ttft:
    description: "Per-turn time-to-first-token. Wall-clock queue wait of a synchronized herd of C sessions."
    status: validated
    headline_field: ttft_pred
    gate: "overall 33.01% MAPE (validate_ttft.py)"
    predictor:
      module: simulator/ttft_queue_sim.py  (predict_cell_ttft_qsim)
      mechanism: >
        Forward closed-loop event-driven queue sim: barrier round-robin arrivals (matches the harness
        asyncio.gather between turns) + vLLM v1 chunked-prefill budget + block-level prefix cache with
        two-tier RECOMPUTE preemption (evict idle herd residents under genuine over-subscription -> MISS
        re-prefill = the climb). Cohort = C sessions drawn from the profile's REALIZED survival, each scaled
        by a measured per-session context-size factor (small sessions stay resident=hits, large minority
        preempted -> median stays a hit near the sharp KV cliff = the osworld saturate-recover).
      cohort_source: "simulator/ramp_tpot.py PROFILE_DIST -> inference-benchmark/data/distributions/<profile>_realized.json"
      shared_kernels: "decode_step_ms (same grid as tpot) for the per-step decode cost; KV pool per config"
    data:
      survival_and_scale: inference-benchmark/data/distributions/*_realized.json  (turn_count histogram + context_scale_quantiles; built by profiling/process/build_realized_session_distributions.py)
      prefill_law: "c1-anchored serving constants in ttft_queue_sim.py (FLOOR 22.5 + NEW 0.031/tok + HOST 6.103/1k split 57/43 + FA3 8.31e-7/tok^2)"

  e2el:
    description: "Per-turn end-to-end latency. Composed, not separately modeled."
    status: validated
    headline_field: e2el_pred
    gate: "overall 19.61% MAPE (validate_ttft.py)"
    formula: "e2el_pred[t] = ttft_pred[t] + output_tokens[t] * tpot_pred[t]"
    note: "E2EL is decode-dominated so it tracks far better than TTFT once TPOT + TTFT are in place."

ground_truth:
  source: /mnt/100g/agent-bench/results/synthetic_distributional/h100_Llama-3.1-8B_tp{1,2}_vllm/<profile>_conc<C>.json
  field: "per_request[] -> ttft_ms / tpot_ms / e2el_ms + cached/new/output tokens, success-filtered, MEDIAN per turn_index. One source for BOTH structure and *_meas (the generator is self-consistent)."
  profiles: [chat-multiturn-synth, osworld-multiturn-synth, swebench-multiturn-synth, terminalbench-multiturn-synth]
  concurrencies: [1, 5, 10, 20, 40, 80, 120, 160, 200, 256, 320]

validate:   # console-only gates, read the JSON, change nothing
  tpot: "python3 -m profiling.process.validate_tpot   -> TPOT 15.91% / swe-plateau 8.83%"
  ttft_e2el: "python3 -m profiling.process.validate_ttft   -> TTFT 33.01% / E2EL 19.61%"
  metric_note: "MAPE = mean per-turn APE (the dashboard badge number). Judge the TTFT climb by WAPE + signed bias, not MAPE (turn-0 noise dominates MAPE)."

how_to_improve:
  ttft:
    - "TTFT WAPE is still ~20% (irreducible c5-c40 stochastic perturbation band + osworld). Deprioritized."
  tp2:
    - "Re-anchor the serving prefill law (FLOOR/NEW/HOST) on tp2 c1 cells -> fixes the tp2 TTFT prefill over-prediction (offline, no GPU)."
    - "Override RooflineParams.peak_bw_bytes_per_s for 2xH100 + re-anchor the TPOT-plateau ceiling (kernel_tpot.py) -> fixes the tp2 TPOT over-prediction (see the tp2 investigation)."
  general:
    - "New (model, GPU) config: profile its decode grid + KV pool (see kernel_composition_method.yaml + profile_data/README.md), add a CONFIGS row to build_simulator_rows.py — no dashboard change needed."

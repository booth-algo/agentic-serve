# Kernel composition method — how measured GPU kernel grids (full prefill, cached prefill,
# decode) are composed into per-step costs, with ground-truth sources and validation MAPEs.
# This is the LOW-LEVEL kernel method. For the end-to-end dashboard TTFT/TPOT/E2EL prediction
# pipeline (which scripts produce simulator-predictions.json, in what order), see
# prediction_pipeline.yaml.

predict:

  full_prefill:
    description: "Q=S, KV=S. Full prompt, no prefix cache."
    status: validated
    mape: "8.2% across 10 N values (N>=192: 5.0%). Leave-one-out cross-validation."
    independence: >
      FA3: fully independent (standalone CUDA events).  GEMM/elementwise/KV_write:
      nsys GPU time proportions are independent, but absolute wall-clock scale
      uses ground truth.  Leave-one-out validates curve smoothness, not absolute
      accuracy.  Partially circular — needs cross-validation across measurement
      runs for full independence.

    ground_truth:
      file: profile_data/kernels/prefill_profile_H100_dense.csv
      script: profiling/profile/vllm/sweep/prefill_steps.py
      points: 15

    predictor:
      formula: "GEMM_compiled(N) + FA3(N) + elementwise(N) + KV_write(N) + other(N)"
      GEMM_compiled:
        source: nsys nvjet kernel time, 10 N values [64..8192]
        data: /data48/kevinlau/tmp/nsys/prefill_N*.nsys-rep
      FA3:
        source: profile_data/kernels/fa3_prefill_H100.csv, 8 N values
      elementwise:
        source: nsys triton kernel proportion, 7.6-8.0% of non-attention
      KV_write:
        source: nsys reshape_and_cache proportion, 1.3% constant
      other:
        source: nsys fill/copy/sampling/embed, 2.8-4.2%

  cached_prefill:
    description: "Q=U, KV=P+U. P cached, U new."
    status: validated
    mape: "9.8% across 20 points (P<=4096). GEMM(16)+elem=13.4ms fitted from data (circular — scale not independently measured). FA3 independent."
    finding: >
      Prefix caching CONFIRMED working. 25/25 cache hits. EngineCore per-step
      wall time. Prefill = GEMM(chunk) + FA3(U,P+U) + elementwise.
      GEMM at chunk=16 is ~2ms (2.5x faster than nsys N=64 at 5.1ms —
      CUDA graph eliminates kernel launch overhead at tiny batch).
      P=8192 uses larger chunks [64..512] due to bucket policy.

    ground_truth:
      file: profile_data/results/cached_prefill_v3_H100.csv
      script: profiling/profile/vllm/cuda_events/cached_prefill_steps_v3.py
      method: delta method (t32-t1)/31, decode_ref=6.5ms
      points: 25

    predictor:
      formula: "GEMM_compiled(chunk=U) + FA3_cached(U, P+U) + elementwise(U) + KV_write(U)"
      GEMM_compiled:
        source: shared with full_prefill — same nsys nvjet curve, evaluated at chunk=U
        note: V1 CUDA graph at chunk=16 ≈ 2 ms; V0 nsys N=16 ≈ 6.8 ms (graph eliminates launch overhead)
      FA3_cached:
        source: profile_data/results/fa3_cached_prefill_H100.csv
        points: 25
        formula: "FA3 with Q=U, KV=P+U (causal mask over the U new tokens against P cached + U new keys)"
      elementwise:
        source: shared with full_prefill — same nsys triton proportion (7.6–8.0%), evaluated at chunk=U
      KV_write:
        source: shared with full_prefill — reshape_and_cache, 1.3% constant proportion, evaluated at chunk=U

  decode:
    description: "Q=1 per request, KV=T. B requests batched."
    status: validated
    mape: "7.4% (median 3.8%) across 44 rows"
    ground_truth:
      file: profile_data/results/decode_profile_H100_large_2026-05-17.csv
      script: profiling/profile/vllm/cuda_events/decode_steps.py
    predictor:
      formula: "NCU_GEMM(B) + XGBoost_attention(B,T) + NCU_small_kernels(B)"
      note: bandwidth-scaling fallback for T beyond per-B training max

  tpot:
    description: "End-to-end TPOT prediction from kernel features + XGBoost"
    status: validated
    mape: "29.0% primary rows, 45.0% all rows (median 9.0%)"
    method: >
      Per-profile leave-one-out XGBoost.  Features: GEMM_compiled(B),
      bandwidth-aware decode attention(B,T), prefill GEMM+FA3,
      elementwise, KV pressure, concurrency, turn_index, output_tokens,
      cache_hit_rate.  No scheduler simulation — kernel costs mapped
      directly to TPOT via learned per-profile relationship.
    predictor:
      script: profiling/process/predictors/predict_tpot_from_kernel_features.py
      ground_truth: profile_data/results/benchmark_turns_llama31_8b_h100_vllm.csv

how_to_correct:

  full_prefill:
    - "Done. 8.2% MAPE. Could collect nsys at N=1,128 to bracket small-N regime."
    - "Engine-step predictor default is now --dense-source=nsys_compiled, which
       reads profile_data/kernels/prefill_compiled_breakdown_H100.csv produced by
       profiling/process/extractors/extract_nsys_prefill_breakdown.py.  That
       extractor pulls per-bucket SHARES from nsys nvjet/triton kernel times
       (independent) and applies them to the prefill_profile_H100_dense.csv
       SCALE — partially circular for absolute scale, but bucket decomposition
       and curve shape come from independent measurement.  Default switch was
       made after engine-step MAPE went 50.92% (forward_pass / isolated cuBLAS)
       → 49.00% (nsys_compiled).  Removed --dense-source=compiled_prefill was
       fully circular (vLLM_prefill_total - FA3); deleted."

  cached_prefill:
    - "9.8% MAPE. GEMM(16)+elem=13.4ms across all chunks."
    - "Nsys at N=16 (V0 mode) gives GEMM=6.8ms — V0 vs V1 CUDA graph bucket difference confirmed."
    - "P=8192: chunk = max(64, U//2) vs P<=4096: chunk=16. Likely KV pressure changing capture sizes."

  decode:
    - "Done at 7.4%.  Could extend NCU flash attention sweep to T=16384 for B>=32."

  tpot:
    - "Add more kernel features: prefill-per-token ratio, context/output ratio, total KV bytes."
    - "Try gradient-boosted regression instead of per-profile LOO for better generalization."

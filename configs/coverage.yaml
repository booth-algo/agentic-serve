# configs/coverage.yaml — per-config data coverage tracker.
# GENERATED by `python3 -m configs.coverage_report --yaml` from configs/deployments/*.json.
# DO NOT hand-edit — edit the deployment manifests (the source of truth AND the wiring), then regenerate.
# A config is calibrated when decode_grid is `measured`; the first-cut configs use the analytic decode
# roofline (decode_grid: missing) and inherit the H100 ceiling/prefill grids. `not_measured` = the gaps.

legend:
  measured: own GPU runs / /mnt/100g data (path present)
  derived: computed from this config's own measured inputs
  inherited: borrowed from another config (see from)
  placeholder: default stand-in, not validated for this config
  missing: required by the predictor but no source -> a run is needed

configs:
  - gpu_key: H100
    model: Llama-3.1-8B
    tp: 1
    engine: vllm
    calibrated: true
    status_counts: {measured: 10}
    inputs:
      decode_grid: measured
      kv_pool: measured
      saturated_ceiling: measured
      roofline_peak: measured
      util_flops: measured
      util_bw: measured
      scheduler_overhead: measured
      cached_prefill_grid: measured
      fa3_grid: measured
      ground_truth: measured
    not_measured: []   # fully calibrated
  - gpu_key: H100x2
    model: Llama-3.1-8B
    tp: 2
    engine: vllm
    calibrated: true
    status_counts: {derived: 1, inherited: 6, measured: 3}
    inputs:
      decode_grid: measured
      kv_pool: measured
      saturated_ceiling: derived
      roofline_peak: inherited
      util_flops: inherited
      util_bw: inherited
      scheduler_overhead: inherited
      cached_prefill_grid: inherited
      fa3_grid: inherited
      ground_truth: measured
    not_measured:
      - {input: roofline_peak, status: inherited, from: H100, note: uses single-H100 peak_bw for tp2 (known over-pred; should be ~2x aggregate bw)}
      - {input: util_flops, status: inherited, from: H100}
      - {input: util_bw, status: inherited, from: H100}
      - {input: scheduler_overhead, status: inherited, from: H100}
      - {input: cached_prefill_grid, status: inherited, from: H100, note: TTFT first-cut}
      - {input: fa3_grid, status: inherited, from: H100}
  - gpu_key: A100
    model: Llama-3.1-8B
    tp: 1
    engine: vllm
    calibrated: true
    status_counts: {inherited: 2, measured: 5, placeholder: 3}
    inputs:
      decode_grid: measured
      kv_pool: measured
      saturated_ceiling: measured
      roofline_peak: measured
      util_flops: placeholder
      util_bw: placeholder
      scheduler_overhead: placeholder
      cached_prefill_grid: inherited
      fa3_grid: inherited
      ground_truth: measured
    not_measured:
      - {input: util_flops, status: placeholder, from: H100, note: affects only OOM-fill; re-anchor on A100}
      - {input: util_bw, status: placeholder, from: H100}
      - {input: scheduler_overhead, status: placeholder, from: H100}
